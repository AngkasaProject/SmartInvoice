name = "smart-invoice"
main = "_worker.ts"

# 1. Ubah compatibility_date ke minimal 2025-04-01
compatibility_date = "2025-04-01"

# 2. Pastikan flag ini ada
compatibility_flags = ["nodejs_compat"]

# (Opsional) Jika ingin tetap pakai tanggal lama, tambahkan flag ini:
# compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[vars]
ENVIRONMENT = "production"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true