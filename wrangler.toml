name = "smart-invoice"
main = "_worker.ts"

# 1. Ubah compatibility_date ke minimal 2025-04-01
compatibility_date = "2025-04-01"

# 2. Pastikan flag ini ada
compatibility_flags = ["nodejs_compat"]

# (Opsional) Jika ingin tetap pakai tanggal lama, tambahkan flag ini:
# compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[vars]
ENVIRONMENT = "production"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "smartinvoice"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations/d1"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "smartinvoice-assets"