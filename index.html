<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>
      SmartInvoice - Aplikasi Invoice Profesional & WhatsApp Gateway
    </title>
    <meta
      name="description"
      content="Aplikasi invoice profesional lengkap dengan fitur cetak/download PDF, kwitansi lunas, pemantau status pembayaran real-time, pengaturan ID usaha, dan pengiriman otomatis via WhatsApp Gateway (OpenWA & Fonnte)."
    />

    <!-- Open Graph (Untuk Preview Sosmed/WA) -->
    <meta
      property="og:title"
      content="SmartInvoice - Aplikasi Invoice & WhatsApp Gateway"
    />
    <meta
      property="og:description"
      content="Aplikasi invoice profesional lengkap dengan fitur cetak/download PDF, kwitansi lunas, pemantau status pembayaran real-time, pengaturan ID usaha, dan pengiriman otomatis via WhatsApp Gateway (OpenWA & Fonnte)."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- FAVICON & MANIFEST -->
    <!-- 1. Favicon Universal (Tab Browser) -->
    <link rel="icon" href="/icon/favicon.ico" sizes="any" />

    <!-- 2. Ikon untuk iOS (iPhone/iPad) -->
    <link rel="apple-touch-icon" href="/icon/apple-touch-icon.png" />

    <!-- 3. Manifest untuk Android (PWA) -->
    <link rel="manifest" href="/icon/site.webmanifest" />

    <!-- Theme Color untuk Android/iOS -->
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Fonts: Manrope (UI) & JetBrains Mono (Angka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
